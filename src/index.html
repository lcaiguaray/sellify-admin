<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>JASNIK Admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root>
      <div class="loading">
        <div class="loading-container">
          <div class="loading-layer loading-layer-1"></div>
          <div class="loading-layer loading-layer-2"></div>
          <div class="loading-layer loading-layer-3"></div>
          <span class="loading-text">Cargando</span>
        </div>
      </div>

      <style>
        :root {
          color-scheme: light;
          --background: oklch(1 0 0);
          --foreground: oklch(0.147 0.004 49.25);
          --primary: oklch(0.82 0.17 90);
        }

        :root.dark {
          color-scheme: dark;
          --background: oklch(0.16 0.01 90);
          --foreground: oklch(0.93 0.04 90);
          --primary: oklch(0.82 0.17 90);
        }

        body {
          margin: 0;
          background-color: var(--background);
        }

        .loading {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: var(--background);
          transition: background-color 0.3s ease;
        }

        .loading-container {
          position: relative;
          width: 80px;
          height: 80px;
        }

        .loading-layer {
          position: absolute;
          border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
          animation: loading 2s ease-in-out infinite;
          background-color: var(--primary);
        }

        .loading-layer-1 {
          inset: 0;
          opacity: 1;
          box-shadow: 0 0 30px color-mix(in srgb, var(--primary) 40%, transparent);
        }

        .loading-layer-2 {
          inset: 8px;
          opacity: 0.6;
          animation-delay: 0.5s;
        }

        .loading-layer-3 {
          inset: 16px;
          opacity: 0.3;
          animation-delay: 1s;
        }

        @keyframes loading {
          0%,
          100% {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            transform: rotate(0deg);
          }
          50% {
            border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
            transform: rotate(180deg);
          }
        }

        .loading-text {
          position: absolute;
          bottom: -40px;
          left: 50%;
          transform: translateX(-50%);
          color: var(--foreground);
          opacity: 0.7;
          font-family:
            system-ui,
            -apple-system,
            sans-serif;
          font-size: 14px;
          font-weight: 500;
          white-space: nowrap;
          transition: color 0.3s ease;
        }

        .loading-text::after {
          content: '...';
          animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
          0%,
          20% {
            content: '';
          }
          40% {
            content: '.';
          }
          60% {
            content: '..';
          }
          80%,
          100% {
            content: '...';
          }
        }
      </style>
    </app-root>
  </body>
</html>
